[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-anthropology-toolkit"
version = "3.9.0"
description = "Computational tools for anthropological and qualitative research: data collection and analysis as an MCP server and Python package"
readme = "README.md"
requires-python = ">=3.10"
# The entire repository is licensed under PolyForm Noncommercial 1.0.0;
# commercial licensing by arrangement.
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Matt Artz" }]
keywords = ["anthropology", "qualitative-research", "ethnography", "mcp"]
dependencies = [
    # Upper bound is load-bearing: mcp 2.0.0 removed mcp.server.fastmcp, which
    # this server imports. An unbounded requirement resolves to it and the
    # server fails at import.
    "mcp>=2.1,<3",
    "requests>=2.31",
    "numpy>=1.26",
    "networkx>=3.2",
]

[project.optional-dependencies]
# nltk is in [data] too: codebook jobs split documents into sentences with it,
# and [data] is what the MCP plugin installs.
chunking = ["nltk>=3.8,<4", "sentence-transformers>=3,<6"]
api = ["anthropic>=0.40"]
data = [
    # scholarly imports bibtexparser.bibdatabase, which bibtexparser 2 removed.
    "bibtexparser>=1.4,<2",
    "feedparser>=6",
    "gnews>=0.3",
    "nltk>=3.8,<4",
    "pytrends>=4.9",
    "scholarly>=1.7",
    "scrapetube>=2.5",
    "youtube-transcript-api>=1.0",
]
# coverage measures the package suite in CI; the rest let the notebook smoke run
# (tests/package/test_notebooks_smoke.py) execute the widget notebooks offline.
test = [
    "pandas>=2.0",
    "ruff>=0.15",
    "coverage>=7.6",
    "ipywidgets>=8",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-slugify>=8",
]

[project.scripts]
ai-anthro-mcp = "ai_anthro_toolkit.mcp.server:main"
ai-anthro-doctor = "ai_anthro_toolkit.doctor:main"
ai-anthro-check = "ai_anthro_toolkit.checks.cli:main"

[project.urls]
Homepage = "https://github.com/MattArtzAnthro/AI-Anthropology-Toolkit"
Repository = "https://github.com/MattArtzAnthro/AI-Anthropology-Toolkit"
Issues = "https://github.com/MattArtzAnthro/AI-Anthropology-Toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_anthro_toolkit.network.viewer" = ["template.html", "assets/*.js", "assets/VENDORED.md"]

[tool.coverage.run]
branch = true
source = ["ai_anthro_toolkit"]
# The network viewer is copied verbatim from gephi-ai and tested there.
omit = ["*/ai_anthro_toolkit/network/viewer/*"]

[tool.coverage.report]
# Line and branch coverage combined, for the package suite (tests/package).
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", "dist_build"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E741: `l` is this codebase's name for a lens. N818: WorkPacket and AmbiguousArtifact are
# public names that callers catch; renaming them would break those callers.
ignore = ["E501", "E741", "N818"]

[tool.ruff.lint.per-file-ignores]
# G and U are networkx's conventional graph names; the dense GEXF writer is kept as written.
"src/ai_anthro_toolkit/network/__init__.py" = ["N806", "E702", "E731"]
# Copied from gephi-ai, where it is canonical; edit it there, not here.
"src/ai_anthro_toolkit/network/viewer/*" = ["N806", "UP031"]
# These tests set sys.path or skip markers before importing the package.
"tests/package/*" = ["E402"]
# The check modules import last, after the registry, so importing them registers their checks.
"src/ai_anthro_toolkit/checks/__init__.py" = ["I001"]
"tests/test_skill_routing.py" = ["N806"]
# Each notebook's first cell runs `!pip install` before its imports, as Colab requires.
# G is networkx's conventional graph name; the two import aliases avoid clashes.
"notebooks/*" = ["E402", "N803", "N806", "N811", "N814"]
