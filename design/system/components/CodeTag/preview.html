<body>
<div id="root" class="aat-demo"></div>
<script>
  var A = window.AAT, h = React.createElement;

    return h("div", { className: "aat-row" }, ["Mutual aid", "Charity framing", "Dignity and stigma", "Being watched", "Logistics and upkeep", "Permits and city rules"].map(function (n, i) { return h(A.CodeTag, { key: n, tone: i + 1 }, n); }));

</script>
