<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField</title></head>
<body>
<div id="root" class="aat-demo"></div>
<script>
  var A = window.AAT, h = React.createElement;
  function Demo() {
    return h("div", { className: "aat-demo" },
      h(A.TextField, { label: "Reason for excluding", hint: "Shown in the decision record.", defaultValue: "Off topic: the speaker is describing a different fridge." }),
      h(A.TextField, { label: "The rule", multiline: true, error: "Write the rule in one sentence." }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
</body>
</html>
