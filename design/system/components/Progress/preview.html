<!doctype html>
<html>
<head><meta charset="utf-8"><title>Progress</title></head>
<body>
<div id="root" class="aat-demo"></div>
<script>
  var A = window.AAT, h = React.createElement;
  function Demo() {
    return h("div", { className: "aat-demo" },
      h("span", { className: "aat-id" }, "Disagreement 3 of 4"),
      h(A.Progress, { total: 4, done: 2, current: 2 }),
      h("span", { className: "aat-id" }, "Code 6 of 7"),
      h(A.Progress, { total: 7, done: 5, current: 5 }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
</body>
</html>
