<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>{{CSS}}</style>
<style>
.aat-desk { box-sizing: border-box; max-width: calc(var(--measure) + 2 * var(--space-6)); margin: 0 auto; padding: var(--space-6) var(--space-4); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-6); }
.aat-desk__head { display: grid; gap: var(--space-1); }
.aat-desk__kind { margin: 0; color: var(--ink-muted); font: 600 13px/20px var(--font-sans); letter-spacing: 0.04em; text-transform: uppercase; }
.aat-desk__head h1 { margin: 0; font: 600 28px/36px var(--font-serif); text-wrap: balance; }
.aat-desk__head h1:empty, .aat-desk__kind:empty { display: none; }
</style>
</head>
<body>
<div class="aat-desk">
<header class="aat-desk__head">
<p class="aat-desk__kind" id="desk-kind">{{KIND}}</p>
{{HEADING}}
</header>
<main id="desk"></main>
{{COLOPHON}}
</div>
{{DATA}}<script>{{BUNDLE}}</script>
</body>
</html>
